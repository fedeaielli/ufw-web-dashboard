<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · Firewall Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 3 5 6v6c0 4.5 3 7.6 7 9 4-1.4 7-4.5 7-9V6l-7-3Z' fill='none' stroke='%2334d399' stroke-width='1.6' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <svg class="login-shield" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3 5 6v6c0 4.5 3 7.6 7 9 4-1.4 7-4.5 7-9V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="m9 12 2.2 2.2L15.5 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Firewall Manager</h1>
      <p>Sign in to manage UFW on this host.</p>
    </div>

    <form class="login-form" method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="reveal" id="reveal" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.9 5.3A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.1 3.9M6.2 7.4A16.6 16.6 0 0 0 2 12s3.5 7 10 7c1.3 0 2.5-.3 3.6-.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <p class="login-error" role="alert">{{error}}</p>

      <button class="btn primary login-submit" type="submit">
        <span class="submit-label">Sign in</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>
  </main>
</body>
</html>
